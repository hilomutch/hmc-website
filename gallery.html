<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MUTCH Exhibition</title>
  <meta name="description" content="MUTCH 作品展示の記録">
  <link rel="stylesheet" href="gallery.css">
</head>

<body>
  <header class="site-header">
    <h1>MUTCH</h1>
    <p>Exhibition Archive</p>
  </header>

  <main>
    <!-- ===== 行事ごとに、この section をコピーして増やしてください ===== -->
    <section class="event">
      <h2 class="event-title">2025 〇〇展</h2>
      <p class="event-info">2025.10.01 – 10.05 ／ 〇〇ギャラリー</p>

      <div class="gallery">
        <!-- 写真1枚ごとに figure をコピーして増やす
             href と src には同じファイル名を書いてください -->
        <figure class="gallery-item">
          <a href="photos/2025-01.jpg">
            <img src="photos/2025-01.jpg" alt="作品タイトル" loading="lazy">
          </a>
          <figcaption>作品タイトル</figcaption>
        </figure>

        <figure class="gallery-item">
          <a href="photos/2025-02.jpg">
            <img src="photos/2025-02.jpg" alt="作品タイトル" loading="lazy">
          </a>
          <figcaption>作品タイトル</figcaption>
        </figure>

        <figure class="gallery-item">
          <a href="photos/2025-03.jpg">
            <img src="photos/2025-03.jpg" alt="作品タイトル" loading="lazy">
          </a>
          <figcaption>作品タイトル</figcaption>
        </figure>
      </div>
    </section>

    <section class="event">
      <h2 class="event-title">2024 〇〇展</h2>
      <p class="event-info">2024.10.01 – 10.05 ／ 〇〇ホール</p>

      <div class="gallery">
        <figure class="gallery-item">
          <a href="photos/2024-01.jpg">
            <img src="photos/2024-01.jpg" alt="作品タイトル" loading="lazy">
          </a>
          <figcaption>作品タイトル</figcaption>
        </figure>

        <figure class="gallery-item">
          <a href="photos/2024-02.jpg">
            <img src="photos/2024-02.jpg" alt="作品タイトル" loading="lazy">
          </a>
          <figcaption>作品タイトル</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">&copy; <span id="year">2026</span> MUTCH. All rights reserved.</footer>

  <!-- ===== 拡大表示（ここは触らなくてOK） ===== -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-btn lb-close" type="button" aria-label="閉じる">×</button>
    <button class="lb-btn lb-prev" type="button" aria-label="前の写真">‹</button>
    <figure class="lb-figure">
      <img class="lb-img" src="" alt="">
      <figcaption class="lb-caption"></figcaption>
      <a class="lb-original" href="" target="_blank" rel="noopener">原寸で開く</a>
    </figure>
    <button class="lb-btn lb-next" type="button" aria-label="次の写真">›</button>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
